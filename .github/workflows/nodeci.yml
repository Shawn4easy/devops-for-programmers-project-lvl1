name: Node CI

# На каждое событие ровно один workflow: здесь нет release-please, поэтому
# main проверяет Node CI.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Приложение лежит в app/, а workflow запускается из корня репозитория.
# Без этого make берёт корневой Makefile с инфраструктурными командами,
# в котором нет ни install, ни lint.
defaults:
  run:
    working-directory: app

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26.x]

    steps:
      - uses: actions/checkout@v7

      # pnpm ставится до setup-node: тот с cache: pnpm ищет уже существующий
      # бинарь, чтобы вычислить путь к store, и иначе падает с
      # «Unable to locate executable file: pnpm».
      # Версия читается из packageManager, а package.json лежит в app/.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install
        run: make install
      - name: Run linter
        run: make lint
      - name: Run tests
        run: make test
