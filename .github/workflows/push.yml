name: Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Тесты гоняются через Docker Compose, поэтому попутно собирается тот же
      # production-образ, который затем уезжает на Docker Hub. Отдельная сборка
      # для публикации не нужна: make push переиспользует слои из кеша.
      - name: Run tests
        run: make ci

      # Логин и публикация идут после тестов: на Hub не должен попадать образ,
      # который не прошёл проверку.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        run: make push
