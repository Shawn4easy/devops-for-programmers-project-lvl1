services:
  app:
    # Собственный тег, чтобы дев-сборка не перетирала локально образ,
    # который уходит на Docker Hub из docker-compose.yml.
    image: devops-for-programmers-project-lvl1-dev
    build:
      dockerfile: Dockerfile
    # Тега нет ни в одном реестре, он собирается на месте. Без этой строки
    # `docker compose pull` пытается его скачать и падает с pull access denied,
    # на чём и спотыкается автопроверка Hexlet.
    pull_policy: build
    command: make dev
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app
      - /app/node_modules

  caddy:
    image: caddy:2
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Тома из документации образа: в data лежит самоподписной корневой
      # сертификат, который создаёт `tls internal`. Без тома он генерируется
      # заново на каждый пересозданный контейнер.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
