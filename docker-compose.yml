services:
  app:
    image: shawn4easy/devops-for-programmers-project-lvl1
    build:
      context: .
      dockerfile: Dockerfile.production
    command: make test
    # Значения заданы здесь, а не только в .env: этот файл в репозиторий не
    # попадает, и без environment CI молча остался бы на sqlite.
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: postgres
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: password
    depends_on:
      db:
        # Приложение накатывает миграции при старте, поэтому ждём не запуска
        # контейнера, а готовности базы принимать подключения.
        condition: service_healthy

  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    # Именованного тома нет намеренно: тесты оставляют после себя строки,
    # и база должна исчезать вместе со стеком.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
